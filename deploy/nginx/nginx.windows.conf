# Complete nginx.conf for the Windows Nginx distribution used by this project.
# Copy this file to <nginx-prefix>/conf/nginx.conf; do not put it inside an
# existing http block or use it as a server-only include.
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    access_log    logs/access.log;
    error_log     logs/error.log warn;

    server {
        listen       80;
        server_name  localhost 127.0.0.1 _;

        # Mini-program avatar uploads can be up to 5MB; the nginx default of
        # 1MB would reject them with 413 before they reach the backend.
        client_max_body_size 10m;

        # "html" is relative to the Nginx installation prefix on Windows.
        # Copy admin-web/dist/* into <nginx-prefix>/html before reloading.
        root         html;
        index        index.html;

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
