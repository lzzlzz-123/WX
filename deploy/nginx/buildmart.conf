server {
    listen 80;
    server_name localhost 127.0.0.1 _;

    # Mini-program avatar uploads can be up to 5MB; the nginx default of
    # 1MB would reject them with 413 before they reach the backend.
    client_max_body_size 10m;

    root /var/www/buildmart;
    index index.html;

    # Keep the SPA entry point revalidatable while fingerprinted assets are cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The Spring Boot application already has /api as its context path.
    # Keep the URI unchanged when proxying (do not add/remove another /api).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vue Router uses history mode; every non-file route must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
